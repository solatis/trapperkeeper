[package]
name = "trapperkeeper-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary is `trapperkeeper` because the milestones call it that
# (`trapperkeeper eval`). The package keeps the `-server` suffix so the bare
# crate name stays free for the Rust sensor library.
[[bin]]
name = "trapperkeeper"
path = "src/main.rs"

# clap parses the command line and figment merges the settings layers; why
# these two is doc/adr/0012-clap-and-figment-for-the-command-line-and-configuration.md.
# figment has only the two providers the layers need; the file format is TOML.
[dependencies]
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
# tokio runs everything (doc/adr/0014-async-everywhere.md); axum serves HTTP
# and utoipa derives the API contract from the handlers
# (doc/adr/0016-axum-and-utoipa-for-http.md). tokio has only the features the
# server uses: the runtime and its macro, sockets, and signals for shutdown.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
utoipa = "6"
utoipa-axum = "0.3"
# tracing is the logging facade and tracing-subscriber writes the lines; the
# format and level rules are doc/adr/0017-tracing-for-structured-logs.md.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# The request log is tower-http's trace layer; no other tower-http feature yet.
tower-http = { version = "0.7", features = ["trace"] }
# The resolved settings are logged as one JSON string, so a reader parses them
# instead of Rust's Debug text; already in the tree through axum's json feature.
serde_json = "1"

[dev-dependencies]
# The settings precedence is one property over generated layers
# (doc/adr/0018-integration-tests-over-unit-tests.md).
proptest = "1"

[lints]
workspace = true
