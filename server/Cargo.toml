[package]
name = "trapperkeeper-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary is `trapperkeeper`, the product's name. The package keeps the
# `-server` suffix so the bare crate name stays free for the Rust sensor
# library.
[[bin]]
name = "trapperkeeper"
path = "src/main.rs"

# The binary is a thin entry point over this library, which the tests drive
# too. The library keeps the package's name, as `trapperkeeper_server`.
[lib]
path = "src/lib.rs"

[dependencies]
# clap parses the command line (ADR-0012).
clap = { version = "4", features = ["derive"] }
# figment merges the settings layers (ADR-0012). Its toml and env features add
# the providers for the file and the environment.
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
# tokio is the runtime (ADR-0014). Its features are the multi-thread runtime
# and its macro, sockets, signals for shutdown, sync for the semaphore of the
# password hashes and the cell of the dummy hash, and time for the timeout of
# the readiness probe.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# axum serves HTTP (ADR-0016).
axum = "0.8"
# utoipa derives the API document from the annotations of the handlers
# (ADR-0016).
utoipa = "6"
# utoipa-axum registers each handler with its description in one `routes!`.
utoipa-axum = "0.3"
# tracing is the logging facade, and tracing-subscriber writes the log lines in
# the format that ADR-0017 sets.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# The trace layer of tower-http writes the request log.
tower-http = { version = "0.7", features = ["trace"] }
# serde_json writes the resolved settings for the log, and the audit trail
# stores path parameters as JSON. axum's json feature already brings it in.
serde_json = "1"
# sqlx runs the store's SQL and its migrations (ADR-0019). The default features
# are off, because the store uses neither the Any driver nor json. macros
# provides `migrate!`. sqlite-bundled compiles SQLite in, and
# tls-rustls-ring-webpki needs no system OpenSSL. postgres and mysql are the
# drivers of the server databases, and mysql serves MariaDB.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "postgres", "mysql", "tls-rustls-ring-webpki", "migrate", "macros"] }
# url parses the database URL, so that the settings can mask its password.
# sqlx already brings it in.
url = "2"
# argon2 hashes passwords into PHC strings (ADR-0022) and stretches the signing
# passphrases into keys (ADR-0025). The default features bring the PHC format
# and the random salt.
argon2 = "0.6"
# Entity ids are version 7 UUIDs, generated in Rust (ADR-0020).
uuid = { version = "1", features = ["v7"] }
# Generated passwords and the signing salt come from rand's thread-local
# generator, which the operating system seeds.
rand = "0.10"
# Access and refresh tokens are HS256 JWTs (ADR-0025). The default features are
# off, because their PEM parsing serves only asymmetric keys. rust_crypto
# provides HMAC.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# The key ids are SHA-256 fingerprints of the derived keys. jsonwebtoken and
# sqlx-core use this sha2 version too.
sha2 = "0.10"
# axum-extra provides the cookie jar extractor for the two token cookies. Its
# default features are off to keep the dependency set small.
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
# cookie provides the type of a cookie's Max-Age, which axum-extra does not
# re-export.
cookie = { version = "0.18", default-features = false }

[dev-dependencies]
# proptest runs the property tests of the server (ADR-0018).
proptest = "1"
# The settings property loads inside figment's jail, which locks the
# environment and the working directory while a case runs.
figment = { version = "0.10", features = ["test"] }

[lints]
workspace = true
