[package]
name = "trapperkeeper-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary is `trapperkeeper` because the milestones call it that
# (`trapperkeeper eval`). The package keeps the `-server` suffix so the bare
# crate name stays free for the Rust sensor library.
[[bin]]
name = "trapperkeeper"
path = "src/main.rs"

[lints]
workspace = true
