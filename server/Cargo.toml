[package]
name = "trapperkeeper-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary is `trapperkeeper` because the milestones call it that
# (`trapperkeeper eval`). The package keeps the `-server` suffix so the bare
# crate name stays free for the Rust sensor library.
[[bin]]
name = "trapperkeeper"
path = "src/main.rs"

# The tests reach the router through this library, and the binary is a thin
# entry point over it. It keeps the package's name.
[lib]
path = "src/lib.rs"

# clap parses the command line and figment merges the settings layers; why
# these two is doc/adr/0012-clap-and-figment-for-the-command-line-and-configuration.md.
# figment has only the two providers the layers need; the file format is TOML.
[dependencies]
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
# tokio runs everything (doc/adr/0014-async-everywhere.md); axum serves HTTP
# and utoipa derives the API contract from the handlers
# (doc/adr/0016-axum-and-utoipa-for-http.md). tokio has only the features the
# server uses: the runtime and its macro, sockets, signals for shutdown, and
# sync for the semaphore that limits concurrent password hashes.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
axum = "0.8"
utoipa = "6"
utoipa-axum = "0.3"
# tracing is the logging facade and tracing-subscriber writes the lines; the
# format and level rules are doc/adr/0017-tracing-for-structured-logs.md.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# The request log is tower-http's trace layer; no other tower-http feature yet.
tower-http = { version = "0.7", features = ["trace"] }
# The resolved settings are logged as one JSON string, so a reader parses them
# instead of Rust's Debug text; already in the tree through axum's json feature.
serde_json = "1"
# sqlx runs the store's SQL and its migrations; why sqlx is
# doc/adr/0019-sqlx-with-hand-written-sql-over-three-backends.md. The default
# features are off, because they bring the Any driver and json, which the store
# does not use. macros is on because it provides migrate!, and the store calls
# none of its compile-time query macros. sqlite-bundled compiles SQLite into
# the binary, so no platform needs a system library. postgres and mysql are the
# server databases, and the mysql driver serves MariaDB. TLS goes through
# rustls, so no platform needs a system OpenSSL.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "postgres", "mysql", "tls-rustls-ring-webpki", "migrate", "macros"] }
# The database URL is parsed to mask its password; already in the tree through
# sqlx.
url = "2"
# Passwords are hashed with Argon2id, stored as PHC strings
# (doc/adr/0022-argon2id-for-passwords.md). The default features bring the
# PHC string format and the random salt.
argon2 = "0.6"
# Entity ids are version 7 UUIDs, generated in Rust (doc/adr/0020).
uuid = { version = "1", features = ["v7"] }
# Generated passwords and the installation's signing salt draw from the
# system's random source.
rand = "0.10"
# Access tokens are HS256 JWTs (doc/adr/0025-signed-tokens-and-the-revocation-cutoff.md).
# Default features off, because PEM parsing is for asymmetric keys; rust_crypto
# is the HMAC provider and pulls the sha2 already in the tree.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# The key ids are fingerprints of the derived keys; the same sha2 jsonwebtoken
# and sqlx use.
sha2 = "0.10"
# The cookie jar extractor for the token cookie; default features off, because
# the rest of axum-extra is unused.
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }

[dev-dependencies]
# The settings precedence is one property over generated layers
# (doc/adr/0018-integration-tests-over-unit-tests.md).
proptest = "1"

[lints]
workspace = true
