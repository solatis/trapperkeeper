name: ci

# Every push on every branch, and no pull_request trigger: the milestone asks
# for every push, and a second trigger would run each commit twice.
on:
  push:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One red platform must not hide the result of the others.
      fail-fast: false
      # Native runners per platform, because the tests must execute there;
      # cross-compiling the arm targets would build and lint only. Labels are
      # pinned to a release, not -latest, so the matrix changes only when
      # edited. The job name is the status check name the master ruleset
      # requires; the owner keeps that list by hand.
      matrix:
        include:
          - { name: linux-amd64, runner: ubuntu-24.04 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: windows-amd64, runner: windows-2025 }
          - { name: windows-aarch64, runner: windows-11-arm }
          - { name: macos-aarch64, runner: macos-15 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The cache keys on the installed rustc, so the toolchain comes first.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # No -D warnings here: the workspace lints table in Cargo.toml denies
      # them, so CI and a local build fail the same way.
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo build --workspace --locked
      # --locked builds the committed Cargo.lock and never resolves anew.
      - run: cargo test --workspace --locked
