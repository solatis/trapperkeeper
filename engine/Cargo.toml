# The package keeps the `-engine` suffix, because the bare crate name
# `trapperkeeper` stays free for the Rust sensor library.
[package]
name = "trapperkeeper-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A pipeline embeds this crate, so it depends on nothing from the server, the
# store or HTTP.
[dependencies]
# serde derives the JSON form of a rule, its tree and a refusal.
serde = { version = "1", features = ["derive"] }
# The `serde` feature of uuid lets serde read and write `rule_id`. No
# generator feature is on, because the server generates the ids and the engine
# only reads them.
uuid = { version = "1", features = ["serde"] }
# regex compiles the pattern of `re.search`, `re.match` and `re.fullmatch`,
# so validation refuses a pattern that a sensor could not compile (ADR-0041).
# The executor also searches a UTF-8 text for a literal with it, so substring
# search needs no other dependency.
regex = "1"

[dev-dependencies]
# serde_json reads and writes the JSON form in the tests. float_roundtrip makes
# it parse a float to the nearest f64, so a value in a rule reads back as the
# number that was written. Without the feature serde_json can be off by one
# unit in the last place.
serde_json = { version = "1", features = ["float_roundtrip"] }
# proptest generates the trees, the rules and the texts that the property
# tests run on (ADR-0018).
proptest = "1"

[lints]
workspace = true
