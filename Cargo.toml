[workspace]
resolver = "3"
# The workspace lists its members by name. A glob does not fit, because the
# top-level directories hold Rust crates beside directories that are not
# crates, such as doc/ today and web/, conformance/ and the SDKs in other
# languages later.
members = ["engine", "server"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/solatis/trapperkeeper"
publish = false

# Lint levels live here, not in CI flags, so a commit fails the same way on a
# developer's machine as in CI. Every crate inherits them with
# `[lints] workspace = true`. The decision and what it rejected are in
# ADR-0011.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
# The pedantic group is the repository's lint level. A single lint is relaxed
# per case with an entry below these groups, never by lowering a group.
# Priority -1 lets such a single-lint entry override the group.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Each Argon2id hash runs over 64 MiB in three passes. The login check, the
# creation and the reset of an account, a password change and the derivation of
# each token-signing key when serve starts each run one hash, and the tests run
# all of them. The dev profile optimizes the argon2 crate alone, so tests and local
# runs pay the optimized cost of each hash. Level 3 is a choice that no
# measurement backs.
[profile.dev.package.argon2]
opt-level = 3
